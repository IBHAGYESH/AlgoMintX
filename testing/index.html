<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AlgoMintX NFT Marketplace Demo</title>
    <link rel="stylesheet" href="styles.css" />
    <script defer src="../dist/algomintx.js"></script>
    <script defer src="./index.js"></script>
  </head>
  <body>
    <header>
      <div class="container header-content">
        <div class="logo">
          <img
            src="https://img.icons8.com/ios-filled/50/ffffff/diamond.png"
            alt="NFT Logo"
          />
          <h1>AlgoMintX NFT Marketplace</h1>
        </div>
      </div>
    </header>

    <nav>
      <div class="container">
        <div class="nav-links">
          <a href="index.html">Home</a>
          <a href="profile.html">Profile</a>
          <a href="about.html">About</a>
        </div>
      </div>
    </nav>

    <main>
      <div class="container">
        <h2 class="page-title">Featured NFTs</h2>
        <div id="loading" class="loading-container">
          <div class="loading-spinner"></div>
          <p class="loading-text">Loading NFTs...</p>
        </div>
        <div id="nft-grid" class="nft-grid"></div>
      </div>
    </main>

    <footer>
      <div class="container footer-content">
        <p>&copy; 2024 AlgoMintX NFT Marketplace. All rights reserved.</p>
      </div>
    </footer>

    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        try {
          const loadingContainer = document.getElementById("loading");
          const nftGrid = document.getElementById("nft-grid");

          // Show loading state
          loadingContainer.style.display = "block";
          nftGrid.style.display = "none";

          const nfts = await window.algoMintXClient.getListedNFTs();
          window.renderNFTCards(nfts);

          // Hide loading state
          loadingContainer.style.display = "none";
          nftGrid.style.display = "grid";
        } catch (error) {
          console.error("Error loading NFTs:", error);
          alert("Failed to load NFTs: " + error.message);
        }
      });
    </script>
  </body>
</html>
