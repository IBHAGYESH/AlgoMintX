<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AlgoMintX Headless Demo</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
          Cantarell, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 40px 20px;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
      }
      h1 {
        color: white;
        text-align: center;
        margin-bottom: 40px;
        font-size: 2.5rem;
      }
      .mint-sections {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 30px;
      }
      @media (max-width: 768px) {
        .mint-sections {
          grid-template-columns: 1fr;
        }
      }
      .mint-card {
        background: white;
        border-radius: 20px;
        padding: 30px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      }
      .mint-card h2 {
        color: #333;
        margin-bottom: 20px;
        font-size: 1.8rem;
        border-bottom: 3px solid #667eea;
        padding-bottom: 10px;
      }
      .form-group {
        margin-bottom: 20px;
      }
      .form-group label {
        display: block;
        margin-bottom: 8px;
        color: #555;
        font-weight: 600;
      }
      .form-group input,
      .form-group textarea {
        width: 100%;
        padding: 12px 15px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 14px;
        transition: border-color 0.3s;
      }
      .form-group input:focus,
      .form-group textarea:focus {
        outline: none;
        border-color: #667eea;
      }
      .form-group textarea {
        resize: vertical;
        min-height: 80px;
      }
      .form-group input[type="file"] {
        padding: 8px;
        cursor: pointer;
      }
      .btn {
        width: 100%;
        padding: 15px;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
      }
      .btn-primary {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
      }
      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
      }
      .btn-primary:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
      }
      .btn-secondary {
        background: #f0f0f0;
        color: #333;
      }
      .btn-secondary:hover {
        background: #e0e0e0;
      }
      .transaction-result {
        margin-top: 20px;
        padding: 15px;
        background: #f8f9fa;
        border-radius: 8px;
        border-left: 4px solid #28a745;
        display: none;
      }
      .transaction-result.show {
        display: block;
      }
      .transaction-result h3 {
        color: #28a745;
        margin-bottom: 10px;
        font-size: 1rem;
      }
      .transaction-result p {
        color: #555;
        font-family: "Courier New", monospace;
        word-break: break-all;
        font-size: 13px;
      }
      .wallet-info {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        border-radius: 10px;
        padding: 15px;
        margin-bottom: 30px;
        color: white;
      }
      .wallet-info h3 {
        margin-bottom: 10px;
        font-size: 1.2rem;
      }
      .wallet-info p {
        font-family: "Courier New", monospace;
        word-break: break-all;
        font-size: 14px;
      }
      .status-badge {
        display: inline-block;
        padding: 5px 15px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
        margin-left: 10px;
      }
      .status-connected {
        background: #28a745;
        color: white;
      }
      .status-disconnected {
        background: #dc3545;
        color: white;
      }
    </style>
    <!-- for local testing-->
    <!-- <script defer src="../../dist/algomintx.js"></script> -->
    <!-- for live testing-->
    <script
      defer
      src="https://cdn.jsdelivr.net/gh/IBHAGYESH/AlgoMintX@latest/dist/algomintx.js"
    ></script>
    <script defer src="./index.js"></script>
  </head>
  <body>
    <div class="container">
      <h1>AlgoMintX Headless Demo</h1>

      <div class="wallet-info">
        <h3>
          Wallet Status
          <span id="wallet-status" class="status-badge status-disconnected"
            >Disconnected</span
          >
        </h3>
        <p id="wallet-address">Not connected</p>
      </div>

      <div class="mint-sections">
        <!-- NFT Minting Section -->
        <div class="mint-card">
          <h2>Mint NFT</h2>
          <form id="nft-form">
            <div class="form-group">
              <label for="nft-name">Name *</label>
              <input
                type="text"
                id="nft-name"
                required
                placeholder="Enter NFT name"
              />
            </div>
            <div class="form-group">
              <label for="nft-description">Description *</label>
              <textarea
                id="nft-description"
                required
                placeholder="Enter NFT description"
              ></textarea>
            </div>
            <div class="form-group">
              <label for="nft-file">Image/Video/Audio File *</label>
              <input
                type="file"
                id="nft-file"
                required
                accept="image/*,video/*,audio/*"
              />
            </div>
            <button type="submit" id="nft-submit" class="btn btn-primary">
              Mint NFT
            </button>
          </form>
          <div id="nft-result" class="transaction-result">
            <h3>✓ NFT Minted Successfully!</h3>
            <p><strong>Transaction ID:</strong> <span id="nft-txid"></span></p>
          </div>
        </div>

        <!-- FT Minting Section -->
        <div class="mint-card">
          <h2>Mint FT (Fungible Token)</h2>
          <form id="ft-form">
            <div class="form-group">
              <label for="ft-name">Name *</label>
              <input
                type="text"
                id="ft-name"
                required
                placeholder="Enter FT name"
              />
            </div>
            <div class="form-group">
              <label for="ft-description">Description *</label>
              <textarea
                id="ft-description"
                required
                placeholder="Enter FT description"
              ></textarea>
            </div>
            <div class="form-group">
              <label for="ft-decimals">Decimals *</label>
              <input
                type="number"
                id="ft-decimals"
                required
                min="0"
                max="18"
                value="6"
                placeholder="Number of decimals (0-18)"
              />
            </div>
            <div class="form-group">
              <label for="ft-supply">Total Supply *</label>
              <input
                type="number"
                id="ft-supply"
                required
                min="1"
                placeholder="Total supply"
              />
            </div>
            <div class="form-group">
              <label for="ft-file">Icon Image (Optional)</label>
              <input type="file" id="ft-file" accept="image/*" />
            </div>
            <button type="submit" id="ft-submit" class="btn btn-primary">
              Mint FT
            </button>
          </form>
          <div id="ft-result" class="transaction-result">
            <h3>✓ FT Minted Successfully!</h3>
            <p><strong>Transaction ID:</strong> <span id="ft-txid"></span></p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
